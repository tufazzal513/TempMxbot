<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp Mail Web Inbox</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto space-y-4">
    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
      <h1 class="text-lg font-bold text-indigo-400">📬 Web Inbox</h1>
      <button onclick="loadInbox()" class="bg-indigo-600 px-3 py-1 text-sm font-medium rounded-md hover:bg-indigo-500 active:scale-95 transition">🔄 Refresh</button>
    </div>

    <!-- Status & Loading View -->
    <div id="loading" class="text-center py-10 text-gray-400">Loading inbox...</div>
    <div id="inbox-list" class="space-y-2 hidden"></div>

    <!-- Message Reader View -->
    <div id="msg-reader" class="hidden bg-gray-800 p-4 rounded-xl space-y-3">
      <button onclick="showList()" class="text-indigo-400 text-sm font-semibold mb-2 flex items-center gap-1">⬅️ Back to Inbox</button>
      <h2 id="msg-subject" class="text-base font-bold text-white border-b border-gray-700 pb-2"></h2>
      <div id="msg-from" class="text-xs text-gray-400"></div>
      <div id="msg-body" class="bg-gray-900 p-3 rounded-lg text-sm text-gray-200 whitespace-pre-wrap max-h-96 overflow-y-auto border border-gray-800"></div>
    </div>
  </div>

  <script>
    // Telegram WebApp Init
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Token extract from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function loadInbox() {
      const loadingEl = document.getElementById('loading');
      const listContainer = document.getElementById('inbox-list');

      if (!token) {
        loadingEl.innerText = '⚠️ Token missing or invalid session!';
        loadingEl.classList.remove('hidden');
        listContainer.classList.add('hidden');
        return;
      }

      loadingEl.innerText = '🔄 Fetching messages...';
      loadingEl.classList.remove('hidden');
      listContainer.classList.add('hidden');
      document.getElementById('msg-reader').classList.add('hidden');

      try {
        const res = await fetch('https://api.mail.tm/messages?page=1', {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/json'
          }
        });

        if (!res.ok) {
          throw new Error('API Error: ' + res.status);
        }

        const data = await res.json();
        listContainer.innerHTML = '';

        const messages = Array.isArray(data) ? data : (data['hydra:member'] || []);

        if (messages.length === 0) {
          listContainer.innerHTML = '<div class="text-center py-8 text-gray-500">📭 Inbox is empty</div>';
        } else {
          messages.forEach(msg => {
            const item = document.createElement('div');
            item.className = 'bg-gray-800 p-3 rounded-lg cursor-pointer hover:bg-gray-700 border border-gray-700/50 transition active:scale-[0.98]';
            item.onclick = () => readMsg(msg.id);
            
            const sub = msg.subject || 'No Subject';
            const sender = msg.from ? msg.from.address : 'Unknown Sender';
            
            item.innerHTML = `
              <div class="font-semibold text-sm text-indigo-300 truncate">${sub}</div>
              <div class="text-xs text-gray-400 truncate mt-1">👤 ${sender}</div>
            `;
            listContainer.appendChild(item);
          });
        }

        loadingEl.classList.add('hidden');
        listContainer.classList.remove('hidden');
      } catch (e) {
        console.error(e);
        loadingEl.innerText = '⚠️ Failed to fetch messages. (' + e.message + ')';
      }
    }

    async function readMsg(id) {
      document.getElementById('inbox-list').classList.add('hidden');
      document.getElementById('msg-reader').classList.remove('hidden');
      document.getElementById('msg-body').innerText = '⏳ Loading content...';

      try {
        const res = await fetch('https://api.mail.tm/messages/' + id, {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/json'
          }
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        const msg = await res.json();
        document.getElementById('msg-subject').innerText = msg.subject || 'No Subject';
        document.getElementById('msg-from').innerText = 'From: ' + (msg.from ? msg.from.address : 'Unknown');
        document.getElementById('msg-body').innerText = msg.text || 'No text body available.';
      } catch (e) {
        document.getElementById('msg-body').innerText = '⚠️ Error loading message body.';
      }
    }

    function showList() {
      document.getElementById('msg-reader').classList.add('hidden');
      document.getElementById('inbox-list').classList.remove('hidden');
    }

    // Auto Load on Open
    loadInbox();
  </script>
</body>
</html>
